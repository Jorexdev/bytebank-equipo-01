name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los tests de integración no pasan en el runner (algo de Docker); de momento solo compilamos
      # para no bloquear las PR. Hay que volver a activarlos.
      - name: Build
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ms-gateway, ms-auth, ms-accounts, ms-transfers, ms-cards, ms-fraud, ms-notifications]
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen ${{ matrix.module }}
        run: docker build --build-arg MODULE=${{ matrix.module }}.
