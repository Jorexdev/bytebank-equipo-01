name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Los tests de integración no pasan en el runner (algo de Docker); de momento solo compilamos
      # para no bloquear las PR. Hay que volver a activarlos.
      - name: Build
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ms-gateway, ms-auth, ms-accounts, ms-transfers, ms-cards, ms-fraud, ms-notifications]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build imagen ${{ matrix.module }}
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
